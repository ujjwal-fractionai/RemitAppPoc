<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EOB Explainer</title>
<link rel="icon" href="data:,">
<style>
  /* Light theme, tokens matched to the bookkeep (ABACUS) app */
  :root {
    color-scheme: light;
    --card: #ffffff; --page: #f7f9fb; --muted: #f4f7f9;
    --fg: #4a4a4a; --muted-fg: #667085; --primary: #1b365d; --primary-hover: #244673;
    --accent: #00a3e0; --border: #d9e2ea; --sidebar-border: #2b4a73; --destructive: #d92d20;
    --paid: #047857; --paid-bg: rgba(16, 185, 129, .10);
    --partial: #b45309; --partial-bg: rgba(245, 158, 11, .12);
    --owes: #0369a1; --owes-bg: rgba(0, 163, 224, .10);
    --denied: #be123c; --denied-bg: rgba(244, 63, 94, .10);
    --reversed: #475467; --reversed-bg: rgba(102, 112, 133, .12);
    --next: #6d28d9; --next-bg: rgba(139, 92, 246, .10);
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--fg);
    font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--muted); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  /* shell + sidebar */
  .shell { display: flex; min-height: 100vh; }
  .sidebar { position: sticky; top: 0; height: 100vh; width: 260px; flex: none; display: flex; flex-direction: column; gap: 24px;
    padding: 16px; background: var(--primary); color: #fff; border-right: 1px solid var(--sidebar-border); }
  .brand { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.10); }
  .mark { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 6px; font-size: 18px;
    color: var(--accent); background: rgba(0,163,224,.20); border: 1px solid rgba(0,163,224,.35); }
  .brand b { display: block; font-size: 14px; letter-spacing: -.01em; }
  .brand small { color: rgba(255,255,255,.65); font-size: 12px; }
  .nav-label { margin: 0 0 8px; padding: 0 8px; font-size: 10px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.5); }
  .sidebar nav { display: flex; flex-direction: column; gap: 8px; }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 6px; font-weight: 500;
    color: rgba(255,255,255,.7); text-decoration: none; border: 1px solid transparent; transition: background .15s, color .15s; }
  .nav-item:hover { background: rgba(255,255,255,.10); color: #fff; }
  .nav-item[aria-current="page"] { color: #fff; background: var(--accent); border-color: rgba(0,163,224,.4); }
  .side-note { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--sidebar-border); font-size: 12px; color: rgba(255,255,255,.7); }
  .side-note b { display: block; margin-bottom: 4px; color: #fff; font-size: 13px; }

  /* page */
  main { flex: 1; min-width: 0; padding: 32px; }
  .page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
  h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -.02em; color: var(--primary); }
  .sub { margin: 4px 0 0; color: var(--muted-fg); }
  h2 { margin: 0; font-size: 15px; font-weight: 600; color: var(--primary); display: flex; align-items: center; gap: 8px; }
  h4 { margin: 16px 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-fg); }
  .muted { color: var(--muted-fg); }
  .small { font-size: 12px; }
  .error { color: var(--destructive); }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border: 0; border-radius: 6px; cursor: pointer;
    font: inherit; font-weight: 500; color: #fff; background: var(--primary); }
  .btn:hover { background: var(--primary-hover); }
  :focus-visible { outline: 3px solid rgba(0,163,224,.5); outline-offset: 2px; }

  #drop { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 24px; padding: 48px 16px; text-align: center; cursor: pointer;
    background: var(--card); border: 2px dashed var(--border); border-radius: var(--radius); transition: border-color .15s, background .15s; }
  #drop:hover, #drop.over { border-color: var(--accent); background: #fbfdfe; }
  #drop .drop-icon { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; font-size: 22px; color: var(--accent); background: var(--owes-bg); }
  #drop strong { color: var(--primary); font-size: 15px; }
  #drop.compact { flex-direction: row; justify-content: center; padding: 14px 16px; }
  #drop.compact .drop-icon { width: 28px; height: 28px; font-size: 14px; }
  #drop.compact .drop-hint { display: none; }

  /* cards */
  .card { margin-top: 16px; padding: 20px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); }
  .card.flush { padding: 0; overflow: hidden; }
  .card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  .card-head.pad { padding: 16px 20px; }
  .card > h2 { margin-bottom: 12px; }
  .card.warn { border-left: 4px solid var(--denied); }
  .card.warn h2 { color: var(--denied); }
  .card.alert { border-left: 4px solid var(--next); }
  .lead { margin: 12px 0 4px; font-size: 15px; color: var(--primary); }
  table.plain { margin-top: 12px; border: 1px solid var(--border); border-radius: 6px; }
  table .name { color: var(--primary); font-weight: 500; }
  .steps { margin: 0; padding-left: 20px; } .steps li { margin: 4px 0; }
  .eyebrow { font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-fg); }
  h2.payer { font-size: 18px; margin-top: 2px; }
  .kv { display: grid; gap: 16px 24px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--muted); grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .kv .val { margin-top: 2px; font-size: 16px; font-weight: 600; color: var(--primary); font-variant-numeric: tabular-nums; }
  .kv .val.strong { font-size: 20px; }
  .kv .val.paid { color: var(--paid); } .kv .val.owes { color: var(--owes); } .kv .val.reversed { color: var(--reversed); }

  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 500;
    white-space: nowrap; color: var(--c); background: var(--c-bg); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
  .tag { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px; color: var(--muted-fg); background: var(--muted); border: 1px solid var(--border); }

  /* bucket tiles */
  .tiles { display: grid; gap: 16px; margin-top: 16px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .tile { display: flex; flex-direction: column; gap: 2px; padding: 16px; text-align: left; cursor: pointer; font: inherit; color: inherit;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); transition: border-color .15s, box-shadow .15s; }
  .tile:hover { border-color: rgba(0,163,224,.4); }
  .tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,163,224,.15); }
  .tile-head { display: flex; align-items: center; gap: 8px; }
  .tile .icon { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 6px; font-size: 13px; font-weight: 700; color: var(--c); background: var(--c-bg); }
  .tile .n { margin-top: 10px; font-size: 28px; font-weight: 600; line-height: 1.1; color: var(--c); font-variant-numeric: tabular-nums; }
  .tile .amt { font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .tile .help { margin-top: 6px; font-size: 12px; color: var(--muted-fg); }

  /* AI + reversals */
  .cols { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; align-items: start; }
  .cols > .card { margin-top: 16px; }
  .card.ai { border-top: 3px solid var(--accent); }
  .spark { width: 26px; height: 26px; display: inline-grid; place-items: center; border-radius: 6px; font-size: 13px; color: var(--accent); background: var(--owes-bg); }
  #ai { margin-top: 12px; }
  .summary { margin: 0; font-size: 15px; color: var(--primary); }
  .actions, .watch { margin: 0; padding: 0; list-style: none; }
  .actions li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--muted); }
  .actions li:last-child { border-bottom: 0; }
  .pri { flex: none; min-width: 58px; text-align: center; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; color: var(--c); background: var(--c-bg); }
  .watch li { padding-left: 16px; position: relative; margin: 4px 0; }
  .watch li::before { content: "•"; position: absolute; left: 4px; color: var(--partial); }
  .ai-meta { margin: 14px 0 0; padding-top: 10px; border-top: 1px dashed var(--border); }
  .key { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--muted); }
  .key ul { margin: 8px 0 0; padding-left: 18px; }
  summary { cursor: pointer; font-size: 13px; color: var(--muted-fg); }
  summary:hover { color: var(--primary); }
  .skeleton i { display: block; height: 12px; margin: 8px 0; border-radius: 4px;
    background: linear-gradient(90deg, var(--muted) 25%, #e9eef3 50%, var(--muted) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  .skeleton i:nth-child(2) { width: 85%; } .skeleton i:nth-child(3) { width: 60%; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .ai-error { padding: 12px 14px; border-radius: 6px; background: var(--denied-bg); }
  .ai-error b { color: var(--denied); }
  .ai-error p { margin: 4px 0 10px; }
  .small-btn { padding: 6px 12px; font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { .skeleton i { animation: none; } }
  .pair { padding: 12px 0; border-bottom: 1px solid var(--muted); }
  .pair:first-of-type { padding-top: 0; }
  .pair:last-of-type { border-bottom: 0; }
  .pair-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; color: var(--primary); }
  .pair-nums { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 6px 0 4px; }

  /* tables */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 10px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--muted); }
  thead th { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; color: var(--muted-fg); background: var(--muted); }
  td.num, th.num { text-align: right; white-space: nowrap; }
  tr.claim { cursor: pointer; transition: background .1s; }
  tr.claim:hover { background: #fafcfd; }
  tr.claim .name { color: var(--primary); font-weight: 500; }
  td.chev { width: 24px; color: var(--muted-fg); }
  tr.detail > td { padding: 4px 12px 16px 36px; background: #fbfcfd; }
  tr.detail table { font-size: 13px; background: var(--card); border: 1px solid var(--border); border-radius: 6px; }
  .gloss { margin: 12px 0 0; }
  .playbook { margin-top: 10px; padding: 10px 14px; border-left: 3px solid var(--denied); background: var(--denied-bg); border-radius: 6px; font-size: 13px; }
  .playbook h4 { margin: 0 0 6px; color: var(--denied); }
  .playbook dl { margin: 0; } .playbook dt { font-weight: 600; margin-top: 6px; } .playbook dd { margin: 2px 0 0; }
  .gloss dt { font-weight: 600; color: var(--primary); }
  .gloss dd { margin: 0 0 10px; color: var(--muted-fg); }

  /* v2 shell: banner, nav count, document header */
  .banner { margin-bottom: 16px; padding: 10px 14px; border-radius: var(--radius); color: var(--denied); background: var(--denied-bg); font-weight: 500; }
  .nav-item .count { margin-left: auto; font-size: 11px; padding: 0 7px; border-radius: 999px; background: rgba(255,255,255,.18); }
  .back { display: inline-block; margin-bottom: 6px; font-size: 13px; color: var(--muted-fg); text-decoration: none; }
  .back:hover { color: var(--primary); }
  .doc-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .btn.ghost { background: #fff; color: var(--primary); border: 1px solid var(--border); text-decoration: none; }
  .btn.ghost:hover { background: var(--muted); }
  a.btn { text-decoration: none; }

  /* upload */
  label.btn.disabled { opacity: .5; cursor: not-allowed; pointer-events: none; }
  main.dropping { outline: 2px dashed var(--accent); outline-offset: -8px; background: rgba(0,163,224,.03); }
  .progress { margin: 0 0 16px; border-left: 4px solid var(--accent); }
  .progress.finished { border-left-color: var(--paid); }
  .progress .rejected { margin: 8px 0 0; padding-left: 18px; color: var(--denied); }
  .spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--owes-bg); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .link { border: 0; background: none; padding: 0; font: inherit; font-size: 12px; color: var(--accent); cursor: pointer; text-decoration: underline; }

  /* documents: tabs, board, list */
  .tabs { display: inline-flex; padding: 3px; border-radius: 8px; background: var(--muted); border: 1px solid var(--border); }
  .tabs a { padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 500; color: var(--muted-fg); text-decoration: none; }
  .tabs a.on { background: #fff; color: var(--primary); box-shadow: 0 1px 2px rgba(16,24,40,.08); }
  .board-wrap { margin-top: 18px; overflow-x: auto; }
  .board { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 12px; align-items: start; }
  .col { background: var(--muted); border: 1px solid var(--border); border-radius: 10px; padding: 10px; min-height: 120px; }
  .colh { display: flex; align-items: center; gap: 6px; margin: 2px 4px 10px; font-size: 12px; font-weight: 600; color: var(--primary); }
  .colh .auto { font-size: 10px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
  .colh .c { margin-left: auto; font-size: 11px; color: var(--muted-fg); background: #fff; border: 1px solid var(--border); padding: 0 7px; border-radius: 999px; }
  .kcard { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
    box-shadow: 0 1px 2px rgba(16,24,40,.04); transition: border-color .15s, box-shadow .15s; }
  .kcard:hover, .kcard:focus-visible { border-color: rgba(0,163,224,.5); box-shadow: 0 4px 12px rgba(16,24,40,.08); }
  .kcard .t { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 600; color: var(--primary); }
  .kcard .t span { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .kcard .m { font-size: 12px; color: var(--muted-fg); margin: 2px 0 6px; overflow-wrap: anywhere; }
  .bd { display: flex; flex-wrap: wrap; gap: 4px; }
  .kcard .mark-reviewed { margin-top: 10px; width: 100%; justify-content: center; }
  .kfoot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .col[data-stage="reviewed"] .kcard { opacity: .8; }
  .doclist .reopen { margin-left: 8px; }
  .card.empty { text-align: center; padding: 40px 16px; }

  /* dashboard */
  .kpis { display: grid; gap: 12px; margin-top: 20px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  .card.kpi { margin: 0; padding: 14px 16px; }
  .kpi .v { margin-top: 4px; font-size: 22px; font-weight: 600; color: var(--c, var(--primary)); font-variant-numeric: tabular-nums; }
  .kpi .s { margin-top: 2px; font-size: 12px; color: var(--muted-fg); }
  .kdot { display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; vertical-align: middle; background: var(--c, var(--primary)); }
  .cols.dash { margin-top: 4px; grid-template-columns: minmax(0, 7fr) minmax(0, 3fr); }
  .attention td:nth-child(3) { min-width: 220px; }
  .attention .tabs button { padding: 4px 10px; border: 0; border-radius: 6px; background: none; font: inherit; font-size: 12px; font-weight: 500; color: var(--muted-fg); cursor: pointer; }
  .attention .tabs button.on { background: #fff; color: var(--primary); box-shadow: 0 1px 2px rgba(16,24,40,.08); }
  .pad-x { padding: 0 20px 20px; }
  .bar { display: flex; gap: 2px; height: 12px; margin: 4px 0 12px; border-radius: 999px; overflow: hidden; background: var(--muted); }
  .legend { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 13px; }
  .legend .amt { text-align: right; font-weight: 500; color: var(--primary); font-variant-numeric: tabular-nums; }

  .btn.danger { background: var(--denied); }
  .btn.danger:hover { background: #9f1239; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .clear-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 16px; }
  .confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; padding: 12px 14px; border-radius: var(--radius);
    background: var(--denied-bg); border: 1px solid rgba(190,18,60,.25); }
  .confirm p { margin: 0 auto 0 0; color: var(--denied); }

  /* rules page */
  .rules td:first-child { width: 26%; color: var(--primary); font-weight: 500; }
  .rules td:last-child { width: 24%; }
  .playbook-rules td:last-child { width: 58%; }
  .chip { display: inline-block; margin: 2px 4px 2px 0; padding: 1px 8px; border-radius: 4px; font-size: 12px; font-weight: 600;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--primary); background: var(--muted); border: 1px solid var(--border); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted-fg); }
  .note { margin-top: 16px; padding: 12px 16px; border-radius: var(--radius); background: var(--owes-bg); color: var(--primary); }
  .two { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .two ul { margin: 0; padding-left: 18px; } .two li { margin: 4px 0; }

  @media (max-width: 1000px) { .cols, .cols.dash { grid-template-columns: 1fr; } }
  @media (max-width: 800px) {
    .shell { flex-direction: column; }
    .sidebar { position: static; height: auto; width: auto; padding: 12px 16px; }
    .nav-label, .side-note { display: none; }
    .sidebar nav { flex-direction: row; flex-wrap: wrap; gap: 6px; } .nav-item { padding: 6px 10px; font-size: 13px; }
    .brand { padding: 8px; }
    main { padding: 20px 16px; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark" aria-hidden="true">≡</div>
      <div><b>REMIT</b><small>Delaware Integrative Healthcare</small></div>
    </div>
    <nav>
      <p class="nav-label">Workspace</p>
      <a class="nav-item" href="#dashboard"><span aria-hidden="true">▦</span> Dashboard</a>
      <a class="nav-item" href="#documents"><span aria-hidden="true">▤</span> Documents <span class="count" id="nav-count">0</span></a>
      <a class="nav-item" href="#rules"><span aria-hidden="true">⚙</span> Rules &amp; settings</a>
      <a class="nav-item" href="/logout" title="Sign out of this browser"><span aria-hidden="true">🔒</span> Lock</a>
    </nav>
    <div class="side-note">
      <b>Made by UY24</b>
      Demo documents only (real EOBs are refused). The AI only sees de-identified numbers and codes: no names, IDs or dates.
    </div>
  </aside>

  <main>
    <input id="file" type="file" accept="application/pdf" multiple hidden disabled>
    <div id="banner"></div>
    <div id="progress"></div>
    <div id="view-dashboard"></div>
    <div id="view-documents" hidden></div>
    <div id="view-doc" hidden></div>
    <div id="view-rules" hidden></div>
  </main>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
